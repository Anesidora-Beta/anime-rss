name: 更新资源订阅

on:
  schedule:
    # 每 20 分钟一次。GitHub 的定时任务在高峰期可能延迟几分钟，属正常现象。
    - cron: "*/20 * * * *"
  workflow_dispatch:            # 支持在 Actions 页面手动点一次
  push:
    branches: [main]

permissions:
  contents: read                # 只读仓库，不需要提交
  pages: write                  # 允许发布到 Pages
  id-token: write               # Pages 部署需要 OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不启用 configure-pages 的自动开启功能：创建 Pages 站点需要仓库管理员权限，
      # GITHUB_TOKEN 拿不到，会报 Resource not accessible by integration。
      # 站点只需在 Settings → Pages 里手动开一次，之后这里就能正常部署。
      - name: 计算站点地址
        id: site
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          if [ "$repo" = "$owner.github.io" ]; then
            echo "url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓取并生成订阅
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: python build_feed.py

      - name: 打包站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
