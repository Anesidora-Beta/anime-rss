name: 更新资源订阅

on:
  schedule:
    # 每 20 分钟一次。GitHub 的定时任务在高峰期可能延迟几分钟，属正常现象。
    - cron: "*/20 * * * *"
  workflow_dispatch:            # 支持在 Actions 页面手动点一次
  push:
    branches: [main]

permissions:
  contents: read                # 只读仓库，不需要提交
  pages: write                  # 允许发布到 Pages
  id-token: write               # Pages 部署需要 OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不启用 configure-pages 的自动开启功能：创建 Pages 站点需要仓库管理员权限，
      # GITHUB_TOKEN 拿不到，会报 Resource not accessible by integration。
      # 站点只需在 Settings → Pages 里手动开一次，之后这里就能正常部署。
      - name: 计算站点地址
        id: site
        run: |
          # GITHUB_REPOSITORY 会保留原始大小写（如 Anesidora-Beta/anime-rss），
          # 而 Pages 域名一律是小写，这里必须转换，否则 RSS 的 self 链接不规范。
          owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo=$(printf '%s' "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          if [ "$repo" = "$owner.github.io" ]; then
            echo "url=https://$owner.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$owner.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      # 生成物不进仓库，所以 Actions 每次都是全新环境。
      # 这里把上一次发布到 Pages 的 feed.json 取回来，build_feed.py 才有历史可合并，
      # 某个源临时失败时它的条目才会保留（最多 RETENTION_DAYS 天），不会突然掉空。
      - name: 取回上一轮条目（滚动保留用）
        run: |
          mkdir -p docs
          if curl -fsS --max-time 30 -A "anime-rss-build/1.0" \
               "${{ steps.site.outputs.url }}/feed.json" -o docs/feed.json.tmp; then
            mv docs/feed.json.tmp docs/feed.json
            echo "已取回历史条目"
          else
            rm -f docs/feed.json.tmp
            echo "无历史数据（首次运行或站点尚未发布），按全新构建处理"
          fi

      - name: 抓取并生成订阅
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: python build_feed.py

      - name: 打包站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
